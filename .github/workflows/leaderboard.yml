name: Validate Agent Anvil Leaderboard

on:
  push:
    branches:
      - main
    paths:
      - "submissions/**/*.json"
      - "leaderboard.csv"
      - "leaderboard.json"
      - "maintainer_reruns/**"
      - "space/**"
      - "scripts/apply_maintainer_reruns.py"
      - "scripts/check_submission_health.py"
      - "scripts/publish_huggingface.py"
      - "scripts/verify_attestations.py"
      - "scripts/verify_github_runs.py"
      - "scripts/write_maintainer_rerun.py"
      - "tests/**"
      - "examples/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "submissions/README.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/leaderboard.yml"
      - ".github/workflows/maintainer-rerun.yml"
  pull_request:
    paths:
      - "submissions/**"
      - "leaderboard.csv"
      - "leaderboard.json"
      - "maintainer_reruns/**"
      - "space/**"
      - "scripts/apply_maintainer_reruns.py"
      - "scripts/check_submission_health.py"
      - "scripts/publish_huggingface.py"
      - "scripts/verify_attestations.py"
      - "scripts/verify_github_runs.py"
      - "scripts/write_maintainer_rerun.py"
      - "tests/**"
      - "examples/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/leaderboard.yml"
      - ".github/workflows/maintainer-rerun.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Test publisher
        run: uv run --with pytest pytest -q tests
      - name: Validate submissions and build index
        run: |
          uvx --from git+https://github.com/agent-axiom/agent-anvil@v0.2.39 \
            anvil leaderboard build submissions \
            --out leaderboard.csv \
            --json-out leaderboard.json \
            --no-artifacts
      - name: Check submission health
        id: submission-health
        run: >
          set +e;
          python3 scripts/check_submission_health.py
          --summary-out agent-anvil-submission-review.md;
          exit_code=$?;
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT";
          exit 0
      - name: Verify GitHub Actions evidence
        id: github-evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/verify_github_runs.py
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Apply maintainer reruns
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/apply_maintainer_reruns.py
      - name: Verify artifact attestations
        id: artifact-attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/verify_attestations.py \
              --warn-only \
              --strict-new-submissions-from "origin/${{ github.base_ref }}" \
              --summary-out agent-anvil-attestation-review.md
          else
            python3 scripts/verify_attestations.py \
              --warn-only \
              --summary-out agent-anvil-attestation-review.md
          fi
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Audit leaderboard decisions
        id: leaderboard-audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          uvx --from git+https://github.com/agent-axiom/agent-anvil@v0.2.39 \
            anvil leaderboard audit submissions \
            --json-out leaderboard_audit.json \
            --markdown-out agent-anvil-leaderboard-audit.md \
            --github-run \
            --fail-on reject
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment submission review
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- agent-anvil-leaderboard-review -->";
            const health = fs.readFileSync("agent-anvil-submission-review.md", "utf8");
            const provenance = fs.readFileSync("agent-anvil-attestation-review.md", "utf8");
            const audit = fs.readFileSync("agent-anvil-leaderboard-audit.md", "utf8");
            const body = `${marker}\n${health}\n\n${provenance}\n\n${audit}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - name: Fail on submission health errors
        if: steps.submission-health.outputs.exit_code != '0'
        run: exit "${{ steps.submission-health.outputs.exit_code }}"
      - name: Fail on GitHub Actions evidence errors
        if: steps.github-evidence.outputs.exit_code != '0'
        run: exit "${{ steps.github-evidence.outputs.exit_code }}"
      - name: Fail on provenance policy errors
        if: steps.artifact-attestations.outputs.exit_code != '0'
        run: exit "${{ steps.artifact-attestations.outputs.exit_code }}"
      - name: Fail on leaderboard audit rejects
        if: steps.leaderboard-audit.outputs.exit_code != '0'
        run: exit "${{ steps.leaderboard-audit.outputs.exit_code }}"
      - name: Prepare Hugging Face payload
        run: python3 scripts/publish_huggingface.py --dry-run
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: agent-anvil-leaderboard-index
          path: |
            leaderboard.csv
            leaderboard.json
            leaderboard_audit.json
            agent-anvil-leaderboard-audit.md
      - name: Publish Hugging Face Dataset and Space
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_ID: ifif/agent-anvil-leaderboard-data
          HF_SPACE_ID: ifif/agent-anvil-leaderboard
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice::HF_TOKEN is not configured; skipping Hugging Face publish."
            exit 0
          fi
          uv run --with huggingface_hub python scripts/publish_huggingface.py
